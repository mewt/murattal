[package]
name = "murattal"
version = "0.2.1"
edition = "2021"
rust-version = "1.74"
description = "Listen to Quran recitation from your terminal — streams full surahs in the background, no mpv or external player needed."
authors = ["Agung Sukariman <agung@smartsalarypro.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/mewt/murattal"
homepage = "https://github.com/mewt/murattal"
keywords = ["quran", "audio", "recitation", "cli", "player"]
categories = ["command-line-utilities", "multimedia::audio"]

# `cargo install murattal` installs a binary called `quran`.
[[bin]]
name = "quran"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
libc = "0.2"

# Desktop audio (cpal/ALSA). Excluded on Android/Termux, which has no ALSA
# device and can't build cpal — there we drive termux-media-player instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3"] }

[profile.release]
opt-level = 3
lto = true
strip = true
